name: mcpi-java   # プロジェクト名を固定（フォルダ名に関係なく、ボリューム名などがこの名前になる）

services:
  mc:
    image: itzg/minecraft-server
    container_name: mc-mcpi
    restart: unless-stopped
    ports:
      - "127.0.0.1:25565:25565"   # Minecraft本体の接続ポート
      - "127.0.0.1:4711:4711"     # mcpi(RaspberryJuice)のAPIポート
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      MODE: "creative"          # ゲームモードをクリエイティブにする
      FORCE_GAMEMODE: "true"    # 入るたびにそのモードに戻す（既存プレイヤーにも効く）
      PLUGINS: "https://github.com/sakebomb/RaspberryJuice/releases/download/v2.0.0/raspberryjuice-2.0.0.jar"
    volumes:
      - mc-data:/data
      - ./plugins:/plugins:ro   # プラグイン設定(config.yml)。起動時に /data/plugins へコピーされる
    stdin_open: true
    tty: true

volumes:
  mc-data:
